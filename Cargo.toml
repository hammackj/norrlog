[workspace]
resolver = "2"
members = ["crates/norrlog-core", "crates/norrlog-api", "crates/norrlog-client", "crates/norrlogd", "crates/norrlog"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Jacob Hammack <172781+hammackj@users.noreply.github.com>"]

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros", "serde"] }
sha2 = "0.10"
# Bundles are uploaded gzipped, and the panel says how big the upload will be
# before anybody presses the button.
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
