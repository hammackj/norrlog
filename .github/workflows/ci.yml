name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt's defaults, no rustfmt.toml: the code is formatted by the tool,
  # never by hand. `cargo fmt --all` fixes whatever this reports.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Real character names and home paths kept out of the repository; see the
  # script for what it looks for and why the names are hashed.
  private:
    name: private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-private.py

  # Clippy at a fixed version, so a new lint in a later release cannot fail
  # a commit that changed nothing. Raise it on purpose, fixing what the new
  # release reports in the same commit. Local allows are kept narrow, each
  # with its reason, and nothing is allowed crate-wide but the workaround in
  # norrlogd/src/main.rs.
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # GPUI draws through Vulkan on Linux and reads keyboards through
      # xkbcommon on both X11 and Wayland; rodio plays alerts through ALSA.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
