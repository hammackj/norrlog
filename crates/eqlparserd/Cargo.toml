[package]
name = "eqlparserd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
flate2 = { workspace = true }
eqlparser-core = { path = "../eqlparser-core" }
eqlparser-api = { path = "../eqlparser-api" }
eqlparser-vision = { path = "../eqlparser-vision" }
eqlparser-shot = { path = "../eqlparser-shot" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "process"] }
axum = { version = "0.8.9", features = ["ws"] }
sha2 = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }

[dev-dependencies]
# For the one test that pins the blocked rule to the reader's own refusal.
# Not a runtime dependency: the daemon reaches `held_reason` through
# eqlparser-shot, which is the only thing that should be calling it.
eqlparser-parse = { path = "../eqlparser-parse" }
# To drive the whole router, middleware included, in tests.
tower = { version = "0.5", features = ["util"] }
