[package]
name = "eqlparserd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
eqlparser-core = { path = "../eqlparser-core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal"] }
axum = { version = "0.8.9", features = ["ws"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }
