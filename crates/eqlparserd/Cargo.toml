[package]
name = "eqlparserd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
eqlparser-core = { path = "../eqlparser-core" }
eqlparser-api = { path = "../eqlparser-api" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "process"] }
axum = { version = "0.8.9", features = ["ws"] }
sha2 = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }

# The tray icon, Linux only: StatusNotifierItem over D-Bus, no GTK, and it
# runs on the tokio runtime the server already has.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[dev-dependencies]
# To drive the whole router, middleware included, in tests.
tower = { version = "0.5", features = ["util"] }
eqlparser-client = { path = "../eqlparser-client" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
