[package]
name = "norrlogd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
norrlog-core = { path = "../norrlog-core" }
norrlog-api = { path = "../norrlog-api" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "signal", "process"] }
axum = { version = "0.8.9", features = ["ws"] }
sha2 = { workspace = true }
libc = "0.2"
memchr = "2"
regex = { workspace = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "charset", "http2"] }

# The tray icon, Linux only: StatusNotifierItem over D-Bus, no GTK, and it
# runs on the tokio runtime the server already has.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"
# The icon is built in, so the tray shows it even with nothing installed.
image = { version = "0.25", default-features = false, features = ["png"] }

# A log's identity on Windows, to notice one replaced at the same path.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# To drive the whole router, middleware included, in tests.
tower = { version = "0.5", features = ["util"] }
norrlog-client = { path = "../norrlog-client" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
