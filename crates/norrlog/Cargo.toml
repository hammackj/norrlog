[package]
name = "norrlog"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
description = "An EverQuest log parser: the window onto the shared norrlogd"
publish = false

[[bin]]
name = "norrlog"
path = "src/main.rs"

[dependencies]
norrlog-api = { path = "../norrlog-api" }
norrlog-client = { path = "../norrlog-client" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-channel = "2.5.0"
base64 = "0.22"
# Cutting an item icon out of its sheet. Already in the tree through GPUI.
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Alert sounds: synthesised tones, played on the default output. Playback
# only; no decoders, since nothing is read from a file.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "macros", "sync", "process"] }
# GPUI pinned exactly as the eqldb collector pins it (the `gpui-pre`
# releases of Zed's GPUI, with gpui-component built against that one).
# Moving either is a deliberate upgrade of both apps, not a `cargo update`.
gpui = { version = "=0.3.12", package = "gpui-pre" }
gpui_platform = { version = "=0.3.12", package = "gpui-pre-platform", features = ["font-kit", "x11", "wayland"] }
gpui-component = "=0.9.1"
regex = { workspace = true }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
# Only used when building for Windows (see build.rs).
embed-resource = "3"

# The overlay's click-through under X11: GPUI sets an input region only on
# Wayland, so the window's input shape is emptied directly.
[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["shape"] }

# The overlay's click-through elsewhere: GPUI has no call for it on either.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
