# cargo-about: the licences of what Norrlog's packages ship. Used by
# packaging/licenses.py; see there.
#
# Licences this project may redistribute under. Where a crate offers a choice
# (MIT OR Apache-2.0), cargo-about picks the first of these it allows, in
# this order, so the choice is explicit rather than every option at once.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "OpenSSL",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
# Only what is compiled into the shipped binaries.
ignore-dev-dependencies = true
ignore-build-dependencies = true
ignore-transitive-dependencies = false
